<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="東京スタイル - レディースファッション通販">
<meta name="theme-color" content="#111111">
<title>東京スタイル | レディースファッション通販</title>

<style>
:root{
--bg:#fafafa;
--text:#222;
--accent:#f59e0b;
--dark:#111;
--radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Meiryo",sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.7;
-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;height:auto}
a{text-decoration:none;color:inherit}
.container{width:min(1200px,calc(100% - 40px));margin:auto}

header{
position:sticky;
top:0;
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
border-bottom:1px solid #eee;
z-index:100;
}
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
gap:20px;
}
.logo{font-size:28px;font-weight:700;letter-spacing:3px}
nav ul{display:flex;gap:20px;list-style:none}
.search{
padding:10px 15px;
border:1px solid #ddd;
border-radius:30px;
width:220px;
}

.hero{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
padding:30px 0;
}
.banner{
position:relative;
overflow:hidden;
border-radius:24px;
min-height:500px;
}
.banner img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}
.banner:hover img{transform:scale(1.04)}
.overlay{
position:absolute;
inset:0;
display:flex;
align-items:flex-end;
padding:35px;
color:#fff;
background:linear-gradient(to top,rgba(0,0,0,.55),transparent);
}
.btn{
display:inline-block;
margin-top:12px;
padding:12px 24px;
background:#fff;
color:#111;
border-radius:30px;
font-weight:700;
}

.section{padding:70px 0}
.section-title{font-size:30px;margin-bottom:30px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:24px;
}
.card{
background:#fff;
border-radius:var(--radius);
overflow:hidden;
box-shadow:0 8px 24px rgba(0,0,0,.06);
transition:.3s;
}
.card:hover{
transform:translateY(-5px);
}
.card img{
height:320px;
width:100%;
object-fit:cover;
}
.card-content{padding:18px}
.price{font-weight:700;color:#e11d48}

.newsletter{
background:#111;
color:#fff;
padding:50px;
border-radius:24px;
text-align:center;
}
.newsletter input{
padding:14px;
width:min(350px,100%);
border:none;
border-radius:30px;
margin-top:15px;
}

footer{
background:#111;
color:#ccc;
padding:50px 0;
margin-top:60px;
text-align:center;
}

@media(max-width:900px){
.hero{grid-template-columns:1fr}
.nav{flex-wrap:wrap}
.search{width:100%}
}
</style>
</head>
<body>

<header>
<div class="container nav">
<div class="logo">東京スタイル</div>
<nav>
<ul>
<li><a href="#categories">カテゴリー</a></li>
<li><a href="#sale">セール</a></li>
<li><a href="#pickup">おすすめ</a></li>
</ul>
</nav>
<input class="search" placeholder="商品を検索...">
</div>
</header>

<div class="container">
<section class="hero">
<div class="banner">
<img loading="eager" src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1400&q=80" alt="fashion">
<div class="overlay">
<div>
<h1>2026 夏コレクション</h1>
<p>最新トレンドをチェック</p>
<a href="#sale" class="btn">今すぐ見る</a>
</div>
</div>
</div>

<div class="banner">
<img loading="lazy" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80" alt="trend">
<div class="overlay"><h2>2026 トレンド</h2></div>
</div>
</section>

<section id="categories" class="section">
<h2 class="section-title">カテゴリー</h2>
<div class="grid">
<div class="card"><img loading="lazy" src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80"><div class="card-content"><h3>トップス</h3></div></div>
<div class="card"><img loading="lazy" src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=600&q=80"><div class="card-content"><h3>ワンピース</h3></div></div>
<div class="card"><img loading="lazy" src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=600&q=80"><div class="card-content"><h3>スカート</h3></div></div>
<div class="card"><img loading="lazy" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80"><div class="card-content"><h3>アクセサリー</h3></div></div>
</div>
</section>

<section id="sale" class="section">
<h2 class="section-title">セール商品</h2>
<div class="grid">
<div class="card"><img loading="lazy" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80"><div class="card-content"><h3>フローラルワンピース</h3><div class="price">¥5,980</div></div></div>
<div class="card"><img loading="lazy" src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=800&q=80"><div class="card-content"><h3>ブルードレス</h3><div class="price">¥6,980</div></div></div>
</div>
</section>

<section id="pickup" class="section">
<h2 class="section-title">おすすめ</h2>
<div class="grid">
<div class="card"><img loading="lazy" src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&w=800&q=80"><div class="card-content"><h3>ホワイトシャツ</h3><div class="price">¥3,980</div></div></div>
<div class="card"><img loading="lazy" src="https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=800&q=80"><div class="card-content"><h3>サンダル</h3><div class="price">¥4,980</div></div></div>
</div>
</section>

<section class="section">
<div class="newsletter">
<h2>メールマガジン登録</h2>
<p>最新情報をお届けします</p>
<input type="email" placeholder="メールアドレス">
</div>
</section>
</div>

<footer>
<p>© 2026 東京スタイル. All Rights Reserved.</p>
</footer>

</body>
</html>
