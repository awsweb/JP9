<style>
:root{
--bg:#fafafa;
--text:#222;
--accent:#f59e0b;
--dark:#111;
--radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Meiryo",sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.7;
-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;height:auto}
a{text-decoration:none;color:inherit}
.container{width:min(1200px,calc(100% - 40px));margin:auto}

header{
position:sticky;
top:0;
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
border-bottom:1px solid #eee;
z-index:100;
}
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
gap:20px;
}
.logo{font-size:28px;font-weight:700;letter-spacing:3px}
nav ul{display:flex;gap:20px;list-style:none}
.search{
padding:10px 15px;
border:1px solid #ddd;
border-radius:30px;
width:220px;
}

.hero{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
padding:30px 0;
}
.banner{
position:relative;
overflow:hidden;
border-radius:24px;
min-height:500px;
}
.banner img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}
.banner:hover img{transform:scale(1.04)}
.overlay{
position:absolute;
inset:0;
display:flex;
align-items:flex-end;
padding:35px;
color:#fff;
background:linear-gradient(to top,rgba(0,0,0,.55),transparent);
}
.btn{
display:inline-block;
margin-top:12px;
padding:12px 24px;
background:#fff;
color:#111;
border-radius:30px;
font-weight:700;
}

.section{padding:70px 0}
.section-title{font-size:30px;margin-bottom:30px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:24px;
}
.card{
background:#fff;
border-radius:var(--radius);
overflow:hidden;
box-shadow:0 8px 24px rgba(0,0,0,.06);
transition:.3s;
}
.card:hover{
transform:translateY(-5px);
}
.card img{
height:320px;
width:100%;
object-fit:cover;
}
.card-content{padding:18px}
.price{font-weight:700;color:#e11d48}

.newsletter{
background:#111;
color:#fff;
padding:50px;
border-radius:24px;
text-align:center;
}
.newsletter input{
padding:14px;
width:min(350px,100%);
border:none;
border-radius:30px;
margin-top:15px;
}

footer{
background:#111;
color:#ccc;
padding:50px 0;
margin-top:60px;
text-align:center;
}

@media(max-width:900px){
.hero{grid-template-columns:1fr}
.nav{flex-wrap:wrap}
.search{width:100%}
}
</style>

                             <button id="c-de" class="c-btn c-dec">拒否する</button>
                         </div>
                     </div>
                 </div>
             `);

             const el = id => document.getElementById(id), box = el("cb");
             let autoCloseTimer;

             const hide = val => { 
                 clearTimeout(autoCloseTimer);
                 localStorage.setItem("cookie-consent", val); 
                 box.classList.remove("show"); 
             };

           
             el("c-ac").onclick = () => hide("accepted");
             el("c-de").onclick = () => hide("declined");
             el("c-cl").onclick = el("c-bg").onclick = () => hide("closed");

             setTimeout(() => box.classList.add("show"), 50);

            
             autoCloseTimer = setTimeout(() => hide("closed"), 2000);
         });
     </script>
